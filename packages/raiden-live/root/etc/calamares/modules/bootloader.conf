---
# GRUB for both firmware types. On UEFI, Ubuntu's grub-install installs the
# Microsoft-signed shim plus Canonical-signed GRUB, so Secure Boot works.
# The EFI directory must match what grub-install derives from GRUB_DISTRIBUTOR
# ("@DISTRO_NAME@" -> "raiden") when GRUB/shim updates reinstall it later;
# otherwise updates would land in a second directory next to this one.
efiBootLoader: "grub"
kernel: "/vmlinuz-linux"
img: "/initramfs-linux.img"
fallback: "/initramfs-linux-fallback.img"
timeout: "10"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
efiBootloaderId: "raiden"
# Calamares would copy the (non-shim) GRUB to EFI/BOOT, which Secure Boot
# rejects; the post-install step installs a shim-based fallback instead.
installEFIFallback: false
