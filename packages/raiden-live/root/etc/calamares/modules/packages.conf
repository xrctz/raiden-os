---
backend: apt
update_db: true
ignore_update_db_error: true

operations:
  # Live-only software is removed from the installed system (Calamares then
  # runs "apt-get autoremove", which also drops their dependencies).
  - remove:
      - raiden-live
      - calamares
      - casper
  # Translations for the chosen language (needs internet; skipped if offline)
  - try_install:
      - language-pack-$LOCALE
      - language-pack-gnome-$LOCALE
      - hunspell-$LOCALE
      - libreoffice-l10n-$LOCALE
      - libreoffice-help-$LOCALE
