---
# Final fix-ups of the installed system (see the script for details):
# NVIDIA driver check, Secure Boot-safe EFI fallback, console keymap,
# initramfs sanity check and cleanup. Runs on the live system with the
# target mounted at ${ROOT}.
dontChroot: true
timeout: 1800
script:
    - command: "/usr/libexec/raiden-live/calamares-postinstall ${ROOT}"
      timeout: 1800
