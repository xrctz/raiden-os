---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 1024MiB
    minimumSize: 300MiB
    label: "EFI"

enableLuksAutomatedPartitioning: true
luksGeneration: luks2

# zram already provides fast compressed swap; a swap file adds a safety net
userSwapChoices:
    - none
    - file
initialSwapChoice: file

drawNestedPartitions: true
alwaysShowPartitionLabels: true
showNotEncryptedBootMessage: false
initialPartitioningChoice: none

defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]

# With encryption: an unencrypted /boot (GRUB can read it) plus an encrypted
# root. Without encryption: just the root partition (and the EFI partition).
partitionLayout:
    - name: "raiden_boot"
      filesystem: ext4
      noEncrypt: true
      onlyPresentWithEncryption: true
      mountPoint: "/boot"
      size: 4G
    - name: "raiden_root"
      filesystem: unknown
      mountPoint: "/"
      size: 100%
