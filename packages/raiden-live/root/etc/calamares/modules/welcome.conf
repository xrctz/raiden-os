---
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
    requiredStorage:    20
    requiredRam:        2.0
    # must return a non-empty page (Ubuntu's check URL answers "204 No Content")
    internetCheckUrl:   https://networkcheck.kde.org
    check:
        - storage
        - ram
        - power
        - internet
        - root
    required:
        - root
        - storage
        - ram

geoip:
    style:    "none"
    url:      "https://geoip.ubuntu.com/lookup"
    selector: "CountryCode"
