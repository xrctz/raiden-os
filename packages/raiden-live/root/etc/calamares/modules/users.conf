---
defaultGroups:
    - adm
    - cdrom
    - dip
    - lpadmin
    - plugdev
    - sudo
    - name: sambashare
      must_exist: false
      system: true
    # GameMode may change CPU speed and game priority (raiden-gaming)
    - name: gamemode
      must_exist: false
      system: true
    # Virtual machines, e.g. Claude's Cowork tasks
    - name: kvm
      must_exist: false
      system: true
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false

passwordRequirements:
    minLength: 4
    maxLength: -1
    libpwquality:
        - minlen=8
        - maxrepeat=3
        - maxsequence=3
        - usersubstr=4
# Users may tick "use a weak password anyway" (like Ubuntu's own installer)
allowWeakPasswords: true
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  forbidden_names:
    - root
    - nginx
    - www-data
    - daemon
    - bin
    - sys
    - sync
    - games
    - man
    - lp
    - mail
    - news
    - uucp
    - proxy
    - backup
    - list
    - irc
    - apt
    - nobody
    - systemd-network
    - systemd-timesync
    - dhcpcd
    - messagebus
    - syslog
    - systemd-resolve
    - usbmux
    - tss
    - uuidd
    - dnsmasq
    - avahi
    - nm-openvpn
    - tcpdump
    - speech-dispatcher
    - cups-pk-helper
    - fwupd-refresh
    - gdm
    - saned
    - cups-browsed
    - hplip
    - polkitd
    - rtkit
    - colord
    - geoclue
    - gnome-remote-desktop
    - nvidia-persistenced
    - live
    - installer

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${first}-${product}"
  forbidden_names: [ localhost ]
