# @DISTRO_NAME@ installer (Calamares 3.3) configuration.
# Based on the tested Kubuntu/Lubuntu 26.04 setup, adapted for a GNOME live
# image with one squashfs, Secure Boot and the NVIDIA driver preinstalled.
---
modules-search: [ local ]

instances:
- id: postinstall
  module: shellprocess
  config: shellprocess_postinstall.conf
- id: logs
  module: shellprocess
  config: shellprocess_logs.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - packages
  - shellprocess@postinstall
  - shellprocess@logs
  - umount
- show:
  - finished

branding: raiden-os
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
