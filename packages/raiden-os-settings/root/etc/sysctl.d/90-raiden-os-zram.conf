# @DISTRO_NAME@: memory tuning for zram swap (same values Fedora and Pop!_OS use).
# zram is much faster than disk, so swapping to it early keeps more page cache
# available and the desktop smoother.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
