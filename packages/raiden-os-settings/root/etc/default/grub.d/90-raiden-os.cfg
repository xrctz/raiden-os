# @DISTRO_NAME@ boot menu.
# The menu stays hidden on single-OS machines (press Esc during boot to show
# it) and appears automatically with a 10 second timeout when another OS such
# as Windows is found.
#
# The graphical theme is shown with Secure Boot off or on legacy BIOS. With
# Secure Boot on, GRUB does not load font files (a security hardening), so the
# menu uses these text colours instead.
GRUB_THEME=/boot/grub/themes/raiden-os/theme.txt
GRUB_GFXMODE=1920x1080,1280x720,auto
GRUB_COLOR_NORMAL="light-gray/black"
GRUB_COLOR_HIGHLIGHT="white/blue"
GRUB_DISABLE_OS_PROBER=false
# With Windows next to it, start whichever system was picked last time; this
# also lets "Restart into Windows" choose the next boot (grub-reboot)
GRUB_DEFAULT=saved
GRUB_SAVEDEFAULT=true
