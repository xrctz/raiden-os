# @DISTRO_NAME@ game tuning (package raiden-gaming); override in /etc/sysctl.d.

# Games and anti-cheat that touch "split locks" are slowed down on purpose by
# the kernel on Intel CPUs (and some newer AMD ones). SteamOS and Bazzite turn
# that penalty off; the kernel still logs such accesses. ("-": skipped quietly
# on kernels without the setting)
-kernel.split_lock_mitigate = 0

# Some games (e.g. CS2, Hogwarts Legacy, DayZ) need far more memory mappings
# than the default; this is the SteamOS value.
vm.max_map_count = 2147483642
