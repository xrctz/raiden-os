# @DISTRO_NAME@ game tuning (package raiden-gaming): larger shader caches, so
# shaders compiled once stay cached (fewer stutters the next time a scene loads).
# NVIDIA: 12 GB instead of 1 GB, and do not shrink it between runs
__GL_SHADER_DISK_CACHE_SIZE=12000000000
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1
# Mesa (AMD, Intel): 12 GB instead of 1 GB
MESA_SHADER_CACHE_MAX_SIZE=12G
