; GameMode settings for @DISTRO_NAME@ (package raiden-gaming).
; GameMode switches on when a game asks for it: Steam games with the launch
; option "gamemoderun %command%", Lutris and Heroic with their GameMode switch.
; Its CPU and priority changes need the user in the "gamemode" group, which
; @DISTRO_NAME@ sets up. All settings: /usr/share/gamemode/gamemode.ini

[general]
; run the CPUs at full speed while a game runs, back to normal afterwards
desiredgov=performance
; give the game a higher CPU priority (nice -10) while it runs
renice=10
; keep the screen awake while playing
inhibit_screensaver=1
