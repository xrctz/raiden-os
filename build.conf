# Raiden OS build configuration
# Everything that defines the identity of the OS lives here. Change the name,
# version or driver branch in this file and rebuild; nothing else needs editing.

DISTRO_NAME="Raiden OS"
DISTRO_ID="raiden-os"            # used for file names, package names, theme ids
DISTRO_VERSION="1.0"
DISTRO_HOME_URL="https://github.com/xrctz/raiden-os"

# Edition: "personal" for your own ISOs (character themes from personal/, and
# Chrome, Claude and Antigravity copied onto the ISO) or "public" for sharing
# (nothing from personal/; Firefox on the ISO, while Chrome, Claude and
# Antigravity, whose licences do not allow passing them on, install from their
# makers on the first start with internet). .\build.ps1 -Public builds it.
EDITION="${EDITION:-personal}"

# Ubuntu base (Ubuntu 26.04 LTS "Resolute Raccoon")
UBUNTU_SUITE="resolute"
UBUNTU_VERSION="26.04"
ARCH="amd64"
MIRROR="http://archive.ubuntu.com/ubuntu/"
SECURITY_MIRROR="http://security.ubuntu.com/ubuntu/"

# Kernel: the HWE track keeps moving to the newest supported kernel with every
# Ubuntu point release (26.04.2, .3, ...), so installed systems get new kernels
# automatically through normal updates. Kernels are signed for Secure Boot.
KERNEL_FLAVOUR="generic-hwe-26.04"

# NVIDIA driver branch shipped on the ISO (open kernel modules, prebuilt and
# signed by Canonical, so it works with Secure Boot). 595 is the current
# Production Branch and what `ubuntu-drivers` recommends for Turing and newer
# GPUs (GTX 16xx, RTX 20/30/40/50 series).
NVIDIA_BRANCH="595"
# Older GeForce cards (Maxwell, Pascal, Volta: GTX 750 to GTX 10xx) need the
# proprietary kernel modules of the 580 legacy branch. The ISO carries that
# driver as well; the installer puts it on computers with such a card.
# Kepler and older (GTX 600/700 except the 750s) use the open-source driver.
NVIDIA_LEGACY_BRANCH="580"

# Character themes (Appearance -> Characters) are built from the art and
# settings you keep in personal/characters/<id>/ (not in git; see
# artwork/make-characters.py). DEFAULT_CHARACTER is the default look:
# wallpaper, accent colour and login screen. Empty: the Aurora wallpaper.
DEFAULT_CHARACTER=""

# Live session
LIVE_USER="live"
LIVE_USER_FULLNAME="Live Session"
LIVE_HOSTNAME="raiden-os"

# ISO
ISO_VOLUME_ID="Raiden OS 1.0 amd64"   # max 32 characters
ISO_FILENAME="raiden-os-1.0-amd64.iso"

# Squashfs compression: zstd decompresses fast (snappy live session, quick installs)
SQUASHFS_COMP="zstd"
SQUASHFS_COMP_OPTS="-Xcompression-level 19"

# Your own settings, e.g. DEFAULT_CHARACTER="...", in personal/build.conf (not
# in git). Public builds ignore them.
if [ "$EDITION" != public ] && [ -f "$SRC_DIR/personal/build.conf" ]; then
  . "$SRC_DIR/personal/build.conf"
fi
